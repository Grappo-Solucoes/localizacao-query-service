spring.application.name=localizacao-query-service

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka: entrada das posicoes publicadas pelo tracking-ingestion-service.
# O grupo e proprio deste servico (diferente do localizacao-core) para que os dois consumam
# todas as posicoes: com o mesmo grupo eles dividiriam as particoes e cada um veria metade delas.
# O offset comeca no fim e o commit e manual, so depois da projecao concluir.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:localizacao-query}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# O produtor publica sem type headers: o tipo alvo vem por listener (spring.json.value.default.type)
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

tracking.topico-veiculo=${TRACKING_TOPIC:tracking.posicao-veiculo.v1}
tracking.topico-aluno=${TRACKING_ALUNO_TOPIC:tracking.posicao-aluno.v1}
# Janela unica de validade do read model, aplicada a viagem e ao aluno. Precisa ficar acima do
# intervalo esperado entre publicacoes: o ingestor so publica quando chega posicao nova, entao uma
# janela curta apagaria a viagem do read model durante um silencio normal de publicacao.
tracking.posicao.ttl-segundos=${TRACKING_POSICAO_TTL_SEGUNDOS:120}
tracking.tempo-limite-processamento-ms=${TRACKING_TIMEOUT_MS:15000}
tracking.idempotencia.ttl-minutos=${TRACKING_IDEMPOTENCIA_TTL_MIN:10}
tracking.erro.tentativas=${TRACKING_ERRO_TENTATIVAS:2}
tracking.erro.backoff-ms=${TRACKING_ERRO_BACKOFF_MS:500}
